
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | LinkEarn</title>
    <meta property="og:type" content="website">
<meta property="og:title" content="LinkEarn – WhatsApp Rewards Platform">
<meta property="og:description" content="Join LinkEarn and discover our WhatsApp rewards platform. Create your account and get started.">
<meta property="og:image" content="https://linkearn.onrender.com/linkearn-preview.png">
<meta property="og:url" content="https://linkearn.onrender.com/">
<meta property="og:site_name" content="LinkEarn">
<meta name="twitter:card" content="summary_large_image">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #f5f8f6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 16px;
    color: #18372a;
}

.container {
    width: 100%;
    max-width: 430px;
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
}

.logo-icon {
    width: 43px;
    height: 43px;
    background: #087c48;
    color: white;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 23px;
    font-weight: bold;
}

.logo h2 {
    font-size: 24px;
    color: #087c48;
    letter-spacing: -0.7px;
}

.card {
    background: white;
    padding: 32px 26px;
    border-radius: 18px;
    border: 1px solid #e8eee9;
    box-shadow: 0 8px 35px rgba(20, 65, 40, 0.06);
}

.heading {
    margin-bottom: 29px;
}

.heading h1 {
    font-size: 28px;
    margin-bottom: 9px;
    color: #173d2a;
}

.heading p {
    font-size: 14px;
    color: #77847c;
    line-height: 1.6;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #294b38;
}

.input-box {
    display: flex;
    align-items: center;
    border: 1px solid #dce6df;
    border-radius: 9px;
    height: 49px;
    overflow: hidden;
    transition: 0.2s;
}

.input-box:focus-within {
    border-color: #087c48;
    box-shadow: 0 0 0 3px rgba(8,124,72,0.08);
}

.input-box input {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    padding: 0 13px;
    font-size: 14px;
    color: #18372a;
    background: transparent;
}

.input-box input::placeholder {
    color: #a5afa8;
}

.password-toggle {
    border: none;
    background: none;
    padding: 0 13px;
    color: #087c48;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
}

.forgot {
    display: flex;
    justify-content: flex-end;
    margin-top: -8px;
    margin-bottom: 22px;
}

.forgot a {
    font-size: 12px;
    color: #087c48;
    text-decoration: none;
    font-weight: 600;
}

.submit-btn {
    width: 100%;
    height: 50px;
    background: #087c48;
    border: none;
    border-radius: 9px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.submit-btn:hover {
    background: #06663b;
}

.submit-btn:active {
    transform: scale(0.98);
}

.submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 11px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
}

.message.error {
    display: block;
    color: #a42626;
    background: #fff0f0;
}

.signup-link {
    text-align: center;
    font-size: 13px;
    color: #77847c;
    margin-top: 24px;
}

.signup-link a {
    color: #087c48;
    font-weight: 600;
    text-decoration: none;
}

.security {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    margin-top: 24px;
    color: #849188;
    font-size: 11px;
}

.security span {
    color: #087c48;
}

.footer {
    text-align: center;
    margin-top: 23px;
    font-size: 11px;
    color: #9aa59e;
}

@media(max-width: 380px) {
    .card {
        padding: 27px 19px;
    }

    .heading h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">L</div>
        <h2>LinkEarn</h2>
    </div>

    <div class="card">

        <div class="heading">
            <h1>Welcome back.</h1>
            <p>Log in to manage your account and keep track of your weekly rewards.</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="identity">Email or username</label>
                <div class="input-box">
                    <input
                        type="text"
                        id="identity"
                        name="identifier"
                        placeholder="Enter email or username"
                        autocomplete="username"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()">
                        SHOW
                    </button>
                </div>
            </div>

            <div class="forgot">
                <a href="#" onclick="alert('Password recovery will be available soon.'); return false;">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Log in
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="signup-link">
            Don't have an account?
            <a href="/signup">Create account</a>
        </div>

        <div class="security">
            <span>✦</span>
            Your account security matters to us.
        </div>

    </div>

    <div class="footer">
        © 2026 LinkEarn. All rights reserved.
    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".password-toggle");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "HIDE";
    } else {
        password.type = "password";
        button.textContent = "SHOW";
    }
}

const loginForm = document.getElementById("loginForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function(e) {
    e.preventDefault();

    message.className = "message";
    message.textContent = "";

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";

    const data = {
        identifier: document.getElementById("identity").value.trim(),
        password: document.getElementById("password").value
    };

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Login failed.");
        }

        window.location.replace(result.redirect || "/home");

    } catch (error) {
        message.textContent = error.message === "Failed to fetch"
            ? "Unable to connect to LinkEarn. Check your internet connection."
            : error.message;

        message.className = "message error";

        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
    }
});
</script>

</body>
</html>
