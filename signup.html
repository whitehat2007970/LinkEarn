
<!DOCTYPE html>
<html lang="en">
<head>
    <meta property="og:type" content="website">

<meta property="og:title"
content="LinkEarn – Earn Rewards with WhatsApp">

<meta property="og:description"
content="Join LinkEarn and connect your WhatsApp number to participate in our rewards platform. Create your account for free.">

<meta property="og:url"
content="https://linkearn.onrender.com">

<meta property="og:site_name"
content="LinkEarn">

<meta name="description"
content="Join LinkEarn and participate in our WhatsApp rewards platform.">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | LinkEarn</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #f5f8f6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 16px;
    color: #18372a;
}

.container {
    width: 100%;
    max-width: 430px;
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
}

.logo-icon {
    width: 43px;
    height: 43px;
    background: #087c48;
    color: white;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 23px;
    font-weight: bold;
}

.logo h2 {
    font-size: 24px;
    color: #087c48;
    letter-spacing: -0.7px;
}

.card {
    background: white;
    padding: 32px 26px;
    border-radius: 18px;
    border: 1px solid #e8eee9;
    box-shadow: 0 8px 35px rgba(20, 65, 40, 0.06);
}

.heading {
    margin-bottom: 27px;
}

.heading h1 {
    font-size: 27px;
    margin-bottom: 9px;
    color: #173d2a;
}

.heading p {
    font-size: 14px;
    color: #77847c;
    line-height: 1.6;
}

.form-group {
    margin-bottom: 19px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #294b38;
}

.input-box {
    display: flex;
    align-items: center;
    border: 1px solid #dce6df;
    border-radius: 9px;
    background: #fff;
    height: 49px;
    overflow: hidden;
    transition: 0.2s;
}

.input-box:focus-within {
    border-color: #087c48;
    box-shadow: 0 0 0 3px rgba(8,124,72,0.08);
}

.input-box input {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    padding: 0 13px;
    font-size: 14px;
    color: #18372a;
    background: transparent;
}

.input-box input::placeholder {
    color: #a5afa8;
}

.country-code {
    padding: 0 12px;
    height: 100%;
    display: flex;
    align-items: center;
    border-right: 1px solid #e4ebe6;
    color: #294b38;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
}

.password-toggle {
    border: none;
    background: none;
    padding: 0 13px;
    color: #087c48;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
}

.submit-btn {
    width: 100%;
    height: 50px;
    background: #087c48;
    border: none;
    border-radius: 9px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: 0.2s;
}

.submit-btn:hover {
    background: #06663b;
}

.submit-btn:active {
    transform: scale(0.98);
}

.submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 11px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
}

.message.error {
    display: block;
    color: #a42626;
    background: #fff0f0;
}

.login-link {
    text-align: center;
    font-size: 13px;
    color: #77847c;
    margin-top: 23px;
}

.login-link a {
    color: #087c48;
    font-weight: 600;
    text-decoration: none;
}

.security {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    margin-top: 23px;
    color: #849188;
    font-size: 11px;
}

.security span {
    color: #087c48;
}

.footer {
    text-align: center;
    margin-top: 23px;
    font-size: 11px;
    color: #9aa59e;
}

@media(max-width: 380px) {
    .card {
        padding: 27px 19px;
    }

    .heading h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">L</div>
        <h2>LinkEarn</h2>
    </div>

    <div class="card">

        <div class="heading">
            <h1>Create your account</h1>
            <p>Join LinkEarn and get started with your WhatsApp rewards journey.</p>
        </div>

        <form id="signupForm">

            <div class="form-group">
                <label for="phone">Phone number</label>
                <div class="input-box">
                    <span class="country-code">🇳🇬 +234</span>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="8012345678"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        inputmode="numeric"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <div class="input-box">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-box">
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        minlength="3"
                        maxlength="20"
                        autocomplete="username"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        autocomplete="new-password"
                        required>
                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()">
                        SHOW
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Create Account
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login">Log in</a>
        </div>

        <div class="security">
            <span>✦</span>
            Your account security matters to us.
        </div>

    </div>

    <div class="footer">
        © 2026 LinkEarn. All rights reserved.
    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".password-toggle");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "HIDE";
    } else {
        password.type = "password";
        button.textContent = "SHOW";
    }
}

const signupForm = document.getElementById("signupForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

signupForm.addEventListener("submit", async function(e) {
    e.preventDefault();

    message.className = "message";
    message.textContent = "";

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    const data = {
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
    };

    try {
        const response = await fetch("/api/signup", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Registration failed.");
        }

        window.location.replace(result.redirect || "/home");

    } catch (error) {
        message.textContent = error.message === "Failed to fetch"
            ? "Unable to connect to LinkEarn. Check your internet connection."
            : error.message;

        message.className = "message error";

        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
    }
});
</script>

</body>
</html>
