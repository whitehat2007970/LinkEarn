
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - WhatsApp Review</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
}

.logo {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #25D366;
    display: flex;
    align-items: center;
    justify-content: center;
}

.brand h2 {
    color: #075E54;
    font-size: 23px;
}

.brand p {
    color: #667781;
    font-size: 12px;
    margin-top: 4px;
}

.heading {
    text-align: center;
    margin-bottom: 25px;
}

.heading h1 {
    font-size: 25px;
    color: #111b21;
    margin-bottom: 8px;
}

.heading p {
    color: #667781;
    font-size: 14px;
}

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #111b21;
    margin-bottom: 8px;
}

.input-group input {
    width: 100%;
    height: 49px;
    padding: 0 14px;
    border: 1px solid #d9dfe3;
    border-radius: 9px;
    outline: none;
    font-size: 14px;
    background: white;
}

.input-group input:focus {
    border-color: #25D366;
    box-shadow: 0 0 0 2px rgba(37,211,102,0.12);
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 65px;
}

.toggle {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #008069;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.submit {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 9px;
    background: #25D366;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 7px;
}

.submit:disabled {
    background: #a8dcb9;
    cursor: not-allowed;
}

.message {
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
    line-height: 1.5;
}

.login {
    text-align: center;
    margin-top: 23px;
    font-size: 14px;
    color: #667781;
}

.login a {
    color: #008069;
    font-weight: bold;
    text-decoration: none;
}

.footer {
    border-top: 1px solid #e9edef;
    margin-top: 24px;
    padding-top: 17px;
    text-align: center;
    color: #8696a0;
    font-size: 11px;
}

@media(max-width:380px) {
    .container {
        padding: 23px 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <!-- WhatsApp logo -->
        <div class="logo">
            <svg viewBox="0 0 32 32"
                 width="36" height="36"
                 fill="white">
                <path d="M16 3C8.82 3 3 8.82 3 16c0 2.3.61 4.55 1.77 6.52L3 29l6.68-1.75A12.94 12.94 0 0 0 16 29c7.18 0 13-5.82 13-13S23.18 3 16 3zm0 23.7c-2 0-3.96-.54-5.65-1.56l-.4-.24-3.96 1.04 1.06-3.86-.26-.42A10.65 10.65 0 1 1 16 26.7zm5.85-7.98c-.32-.16-1.9-.94-2.2-1.05-.3-.1-.51-.16-.72.16-.21.32-.83 1.05-1.02 1.27-.19.21-.37.24-.69.08-.32-.16-1.35-.5-2.57-1.6-.95-.85-1.6-1.9-1.78-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.19.21-.32.32-.53.1-.21.05-.4-.03-.56-.08-.16-.72-1.74-.99-2.38-.26-.63-.53-.54-.72-.55h-.61c-.21 0-.56.08-.85.4-.29.32-1.11 1.08-1.11 2.64s1.14 3.06 1.3 3.27c.16.21 2.24 3.42 5.43 4.8.76.33 1.35.52 1.81.67.76.24 1.45.21 2 .13.61-.09 1.9-.77 2.17-1.52.27-.74.27-1.37.19-1.5-.08-.13-.29-.21-.61-.37z"/>
            </svg>
        </div>

        <div class="brand">
            <h2>WhatsApp Review</h2>
            <p>Independent review community</p>
        </div>

    </div>

    <div class="heading">
        <h1>Create Account</h1>
        <p>Join our community today</p>
    </div>

    <form id="signupForm">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text"
                   id="username"
                   placeholder="Enter your full name"
                   required
                   autocomplete="name">
        </div>

        <div class="input-group">
            <label>WhatsApp Number</label>
            <input type="tel"
                   id="phone"
                   placeholder="+234 800 000 0000"
                   required
                   autocomplete="tel">
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email"
                   id="email"
                   placeholder="Enter your email address"
                   required
                   autocomplete="email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="password-wrap">
                <input type="password"
                       id="password"
                       placeholder="Create a password"
                       minlength="8"
                       required
                       autocomplete="new-password">

                <button type="button"
                        class="toggle"
                        onclick="togglePassword('password',this)">
                    SHOW
                </button>
            </div>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <div class="password-wrap">
                <input type="password"
                       id="confirmPassword"
                       placeholder="Confirm your password"
                       minlength="8"
                       required
                       autocomplete="new-password">

                <button type="button"
                        class="toggle"
                        onclick="togglePassword('confirmPassword',this)">
                    SHOW
                </button>
            </div>
        </div>

        <button type="submit"
                class="submit"
                id="submitBtn">
            Create Account
        </button>

        <div class="message" id="message"></div>

    </form>

    <div class="login">
        Already have an account?
        <a href="/login">Log in</a>
    </div>

    <div class="footer">
        Independent platform · HERE FOR YOU!
    </div>

</div>

<script>

const form = document.getElementById("signupForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

function togglePassword(id, button) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "HIDE";
    } else {
        input.type = "password";
        button.textContent = "SHOW";
    }
}

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    message.style.color = "#d93025";

    if (password.length < 8) {
        message.textContent =
            "Password must contain at least 8 characters.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating Account...";
    message.textContent = "Please wait...";

    try {

        const response = await fetch("/api/signup", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                phone,
                email,
                password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Registration failed.");
        }

        message.style.color = "#008069";
        message.textContent = "Account created successfully!";

        window.location.href = data.redirect || "/home";

    } catch (error) {

        message.style.color = "#d93025";
        message.textContent = error.message;

        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
    }

});

</script>

</body>
</html>
